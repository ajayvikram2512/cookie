<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <header>
        <h1>Mini Store</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
        </nav>
    </header>

    <main>

        <section id="home" class="hero">
            <h2>Welcome to Mini Store</h2>
            <p>Simple products at simple prices.</p>
            <button id="shopButton">Shop Now</button>
        </section>

        <section id="products">
            <h2>Our Products</h2>

            <div class="products">

                <article class="card">
                    <h3>Headphones</h3>
                    <p>₹999</p>
                    <button class="addButton">Add to Cart</button>
                </article>

                <article class="card">
                    <h3>Smart Watch</h3>
                    <p>₹1,499</p>
                    <button class="addButton">Add to Cart</button>
                </article>

                <article class="card">
                    <h3>Backpack</h3>
                    <p>₹799</p>
                    <button class="addButton">Add to Cart</button>
                </article>

            </div>

            <p id="message"></p>
        </section>

    </main>

    <footer>
        <p>© 2026 Mini Store</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
